<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وكالة - نظام إدارة الوكالات الزراعية</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- التنسيقات المخصصة (انسخ هنا الـ Style أعلاه) -->
    <style>
        /* الصق هنا كل التنسيقات التي أعطيتها أعلاه */
    </style>
</head>
<body>

<!-- حاوية التطبيق -->
<div id="app" class="min-h-screen flex items-center justify-center p-4"></div>

<!-- عنصر التنبيهات -->
<div id="toast" class="hidden fixed top-4 left-1/2 transform -translate-x-1/2 z-50 toast"></div>

<!-- شريط التنقل السفلي (سيظهر تلقائياً) -->
<div class="mobile-nav" id="mobileNav">
    <a href="#" onclick="window.showDashboard(); return false;" class="mobile-nav-item">
        <i class="fas fa-home"></i>
        <span>الرئيسية</span>
    </a>
    <a href="#" onclick="window.showSaleForm(); return false;" class="mobile-nav-item">
        <i class="fas fa-cash-register"></i>
        <span>مبيعات</span>
    </a>
    <a href="#" onclick="window.showPurchaseForm(); return false;" class="mobile-nav-item">
        <i class="fas fa-shopping-cart"></i>
        <span>مشتريات</span>
    </a>
    <a href="#" onclick="window.showWorkersList(); return false;" class="mobile-nav-item">
        <i class="fas fa-users"></i>
        <span>عمالة</span>
    </a>
    <a href="#" onclick="window.showExpensesList(); return false;" class="mobile-nav-item">
        <i class="fas fa-file-invoice"></i>
        <span>مصروفات</span>
    </a>
</div>

<!-- شريط الاختصارات -->
<div class="shortcuts-bar" id="shortcutsBar">
    <span><span class="shortcut-badge">F1</span> مبيعات</span>
    <span><span class="shortcut-badge">F2</span> مشتريات</span>
    <span><span class="shortcut-badge">F3</span> عمالة</span>
    <span><span class="shortcut-badge">F4</span> رئيسية</span>
    <span><span class="shortcut-badge">F5</span> تحديث</span>
</div>

<!-- تحميل JavaScript -->
<script type="module" src="script.js"></script>

<script>
    // إظهار شريط التنقل على الموبايل
    if (window.innerWidth <= 768) {
        document.getElementById('mobileNav').style.display = 'flex';
    }
    
    window.addEventListener('resize', function() {
        if (window.innerWidth <= 768) {
            document.getElementById('mobileNav').style.display = 'flex';
        } else {
            document.getElementById('mobileNav').style.display = 'none';
        }
    });
</script>

</body>
</html>
