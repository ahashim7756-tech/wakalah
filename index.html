<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وكالة - Wakala SaaS | إدارة الوكالات الزراعية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- دمج الـ CSS هنا -->
    <style>
        /* ===== المتغيرات الأساسية ===== */
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f97316;
            --info: #3b82f6;
            --card-bg: #1e293b;
            --card-hover: #2d3a4f;
            --border: #334155;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            min-height: 100vh;
        }

        .bg-card {
            background-color: var(--card-bg);
            transition: all 0.3s ease;
            border: 1px solid var(--border);
        }

        .bg-card:hover {
            background-color: var(--card-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .text-accent { color: var(--primary); }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-warning { color: var(--warning); }
        .text-info { color: var(--info); }

        button {
            transition: all 0.2s ease;
            font-weight: 700;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        input, select, textarea {
            border-radius: 0.75rem !important;
            background-color: #2d3a4f !important;
            border: 2px solid var(--border) !important;
            color: white !important;
            padding: 0.75rem 1rem !important;
            transition: all 0.2s ease !important;
        }

        input:focus, select:focus, textarea:focus {
            outline: none !important;
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2) !important;
            background-color: #334155 !important;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #2d3a4f;
            color: var(--primary);
            font-weight: 700;
            padding: 1rem;
            text-align: center;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 0.75rem 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
            color: #e2e8f0;
        }

        tr:hover {
            background-color: #2d3a4f;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--card-bg) 0%, #2d3a4f 100%);
            border-radius: 1rem;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--info));
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        #toast {
            animation: slideDown 0.3s ease;
        }

        .toast-success {
            background-color: #10b981;
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5);
            font-weight: bold;
            border-right: 6px solid #059669;
        }

        .toast-error {
            background-color: #ef4444;
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.5);
            font-weight: bold;
            border-right: 6px solid #b91c1c;
        }

        .toast-info {
            background-color: #3b82f6;
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
            font-weight: bold;
            border-right: 6px solid #1d4ed8;
        }

        @keyframes slideDown {
            from {
                transform: translate(-50%, -100%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            display: inline-block;
        }

        .badge-success {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .badge-danger {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .badge-warning {
            background-color: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body class="bg-gray-900 font-[Tajawal] text-white">

<!-- شاشة التحميل -->
<div id="loadingScreen" class="fixed inset-0 bg-gray-900 z-50 flex items-center justify-center hidden">
    <div class="text-center">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-amber-500 border-solid mx-auto mb-4"></div>
        <p class="text-amber-400 text-xl font-bold">جاري التحميل...</p>
    </div>
</div>

<!-- رسائل التنبيه -->
<div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 hidden"></div>

<main id="app" class="min-h-screen flex items-center justify-center p-6">
    <!-- يتم تحميل المحتوى ديناميكياً عبر JavaScript -->
</main>

<!-- دمج الـ Firebase والـ JavaScript هنا -->
<script type="module">
    // ========== Firebase Config مباشرة ==========
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { 
        getFirestore, collection, addDoc, getDocs, query, doc, 
        deleteDoc, orderBy, serverTimestamp, writeBatch, increment,
        enableIndexedDbPersistence, CACHE_SIZE_UNLIMITED 
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    // إعدادات Firebase المؤقتة (للتجربة بدون حساب حقيقي)
    // ملاحظة: للتجربة المباشرة، استخدم هذه الإعدادات أو قم بإنشاء مشروعك الخاص
    const firebaseConfig = {
        apiKey: "AIzaSyBxXxXxXxXxXxXxXxXxXxXxXxXxXxXxXx",
        authDomain: "wakala-saas.firebaseapp.com",
        projectId: "wakala-saas",
        storageBucket: "wakala-saas.appspot.com",
        messagingSenderId: "123456789012",
        appId: "1:123456789012:web:abc123def456ghi789"
    };

    // تهيئة Firebase
    const appFirebase = initializeApp(firebaseConfig);
    const db = getFirestore(appFirebase);
    const auth = getAuth(appFirebase);

    // تفعيل التخزين المحلي
    try {
        enableIndexedDbPersistence(db, { cacheSizeBytes: CACHE_SIZE_UNLIMITED })
            .then(() => console.log('✅ تم تفعيل التخزين المحلي'))
            .catch((err) => {
                if (err.code === 'failed-precondition') {
                    console.warn('⚠️ التخزين المحلي غير متاح - عدة نوافذ مفتوحة');
                }
            });
    } catch (error) {
        console.warn('⚠️ خطأ في تفعيل التخزين المحلي:', error);
    }

    // ========== المتغيرات العامة ==========
    const app = document.getElementById('app');
    let farmers = [];
    let loans = [];
    let sales = [];
    let expenses = [];

    // ========== دوال مساعدة ==========
    function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        toast.className = `fixed top-4 left-1/2 transform -translate-x-1/2 z-50 toast-${type} shadow-2xl`;
        toast.innerHTML = `
            <div class="flex items-center gap-3">
                <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'} text-xl"></i>
                <span class="font-bold">${message}</span>
            </div>
        `;
        toast.classList.remove('hidden');
        
        setTimeout(() => {
            toast.classList.add('hidden');
        }, 3000);
    }

    // ========== شاشة تسجيل الدخول ==========
    function showLogin() {
        app.innerHTML = `
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <div class="inline-block p-4 bg-amber-500/20 rounded-full mb-4">
                    <i class="fas fa-seedling text-5xl text-amber-400"></i>
                </div>
                <h1 class="text-4xl font-extrabold text-amber-400 mb-2">وكالة</h1>
                <p class="text-gray-400 text-lg">نظام إدارة الوكالات الزراعية</p>
            </div>
            
            <div class="bg-gray-800/50 backdrop-blur-sm p-8 rounded-2xl shadow-2xl border border-gray-700">
                <h2 class="text-2xl mb-6 text-amber-400 font-bold flex items-center gap-2">
                    <i class="fas fa-lock"></i>
                    <span>تسجيل دخول الإدارة</span>
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-300 mb-2">كلمة المرور</label>
                        <input id="password" type="password" placeholder="أدخل كلمة المرور" 
                               class="w-full p-4 rounded-xl bg-gray-700 border border-gray-600 text-white focus:border-amber-500 transition"/>
                    </div>
                    
                    <button id="loginBtn" 
                            class="w-full bg-gradient-to-l from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 py-4 rounded-xl font-bold text-lg shadow-lg shadow-amber-500/30 transition transform hover:scale-[1.02]">
                        <i class="fas fa-sign-in-alt ml-2"></i>
                        دخول
                    </button>
                    
                    <p id="msg" class="mt-4 text-red-500 font-bold text-center"></p>
                </div>
            </div>
            
            <p class="text-center text-gray-500 mt-8 text-sm">
                © 2024 وكالة - جميع الحقوق محفوظة
            </p>
        </div>
        `;
        
        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    }

    function login() {
        const pwd = document.getElementById('password').value;
        if(pwd === "wakala123") {
            showToast('تم تسجيل الدخول بنجاح', 'success');
            showDashboard();
        } else {
            document.getElementById('msg').innerText = "❌ كلمة المرور غير صحيحة";
            showToast('كلمة المرور غير صحيحة', 'error');
        }
    }

    // ========== لوحة التحكم ==========
    function showDashboard() {
        app.innerHTML = `
        <div class="w-full max-w-7xl">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8">
                <div class="flex items-center gap-3 mb-4 md:mb-0">
                    <div class="p-3 bg-amber-500/20 rounded-2xl">
                        <i class="fas fa-chart-pie text-3xl text-amber-400"></i>
                    </div>
                    <div>
                        <h2 class="text-3xl font-extrabold text-amber-400">لوحة التحكم</h2>
                        <p class="text-gray-400">نظام إدارة الوكالة المتكامل</p>
                    </div>
                </div>
                
                <div class="flex gap-3">
                    <button id="refreshBtn" class="bg-gray-800 hover:bg-gray-700 p-3 rounded-xl transition">
                        <i class="fas fa-sync-alt text-amber-400"></i>
                    </button>
                    <button id="logoutBtn" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 px-6 py-3 rounded-xl font-bold transition flex items-center gap-2">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>تسجيل خروج</span>
                    </button>
                </div>
            </div>
            
            <div id="stats" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></div>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <button id="addFarmer" class="stat-card flex flex-col items-center justify-center p-4 hover:scale-105">
                    <div class="stat-icon bg-green-500/20 text-green-400">
                        <i class="fas fa-user-plus text-2xl"></i>
                    </div>
                    <span class="font-bold mt-2">إضافة فلاح</span>
                </button>
                
                <button id="addLoan" class="stat-card flex flex-col items-center justify-center p-4 hover:scale-105">
                    <div class="stat-icon bg-blue-500/20 text-blue-400">
                        <i class="fas fa-hand-holding-usd text-2xl"></i>
                    </div>
                    <span class="font-bold mt-2">إضافة سلفة</span>
                </button>
                
                <button id="addSale" class="stat-card flex flex-col items-center justify-center p-4 hover:scale-105">
                    <div class="stat-icon bg-purple-500/20 text-purple-400">
                        <i class="fas fa-shopping-cart text-2xl"></i>
                    </div>
                    <span class="font-bold mt-2">تسجيل بيع</span>
                </button>
                
                <button id="addExpense" class="stat-card flex flex-col items-center justify-center p-4 hover:scale-105">
                    <div class="stat-icon bg-orange-500/20 text-orange-400">
                        <i class="fas fa-wallet text-2xl"></i>
                    </div>
                    <span class="font-bold mt-2">مصروفات</span>
                </button>
            </div>
            
            <div class="flex border-b border-gray-700 mb-6">
                <button id="tabFarmers" class="tab-btn px-6 py-3 font-bold text-gray-400 hover:text-amber-400 border-b-2 border-transparent transition">
                    <i class="fas fa-users ml-2"></i>
                    الفلاحين
                </button>
                <button id="tabLoans" class="tab-btn px-6 py-3 font-bold text-gray-400 hover:text-amber-400 border-b-2 border-transparent transition">
                    <i class="fas fa-hand-holding-usd ml-2"></i>
                    السلف
                </button>
                <button id="tabSales" class="tab-btn px-6 py-3 font-bold text-gray-400 hover:text-amber-400 border-b-2 border-transparent transition">
                    <i class="fas fa-chart-line ml-2"></i>
                    المبيعات
                </button>
                <button id="tabExpenses" class="tab-btn px-6 py-3 font-bold text-gray-400 hover:text-amber-400 border-b-2 border-transparent transition">
                    <i class="fas fa-file-invoice ml-2"></i>
                    المصروفات
                </button>
            </div>
            
            <div id="content" class="bg-card rounded-2xl p-6 border border-gray-700"></div>
        </div>
        `;
        
        document.getElementById('addFarmer').addEventListener('click', () => showFarmerForm());
        document.getElementById('addLoan').addEventListener('click', () => showLoanForm());
        document.getElementById('addSale').addEventListener('click', () => showSaleForm());
        document.getElementById('addExpense').addEventListener('click', () => showExpenseForm());
        document.getElementById('refreshBtn').addEventListener('click', refreshData);
        document.getElementById('logoutBtn').addEventListener('click', showLogin);
        
        document.getElementById('tabFarmers').addEventListener('click', () => showFarmersList());
        document.getElementById('tabLoans').addEventListener('click', () => showLoansList());
        document.getElementById('tabSales').addEventListener('click', () => showSalesList());
        document.getElementById('tabExpenses').addEventListener('click', () => showExpensesList());
        
        refreshData();
        showFarmersList();
    }

    // ========== تحديث الإحصائيات ==========
    async function updateStats() {
        const statsDiv = document.getElementById('stats');
        
        try {
            const farmersSnap = await getDocs(collection(db, "farmers"));
            const loansSnap = await getDocs(collection(db, "loans"));
            const salesSnap = await getDocs(collection(db, "sales"));
            const expensesSnap = await getDocs(collection(db, "expenses"));
            
            const totalFarmers = farmersSnap.size;
            
            let totalLoans = 0;
            loansSnap.forEach(doc => {
                totalLoans += doc.data().amount || 0;
            });
            
            let totalSales = 0;
            salesSnap.forEach(doc => {
                totalSales += doc.data().total || 0;
            });
            
            let totalExpenses = 0;
            expensesSnap.forEach(doc => {
                totalExpenses += doc.data().amount || 0;
            });
            
            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="stat-icon bg-green-500/20 text-green-400">
                        <i class="fas fa-users"></i>
                    </div>
                    <p class="text-sm opacity-60">عدد الفلاحين</p>
                    <p class="text-2xl font-bold">${totalFarmers}</p>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon bg-blue-500/20 text-blue-400">
                        <i class="fas fa-hand-holding-usd"></i>
                    </div>
                    <p class="text-sm opacity-60">إجمالي السلف</p>
                    <p class="text-2xl font-bold">${totalLoans.toLocaleString()} ج.م</p>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon bg-purple-500/20 text-purple-400">
                        <i class="fas fa-shopping-cart"></i>
                    </div>
                    <p class="text-sm opacity-60">إجمالي المبيعات</p>
                    <p class="text-2xl font-bold">${totalSales.toLocaleString()} ج.م</p>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon bg-orange-500/20 text-orange-400">
                        <i class="fas fa-wallet"></i>
                    </div>
                    <p class="text-sm opacity-60">إجمالي المصروفات</p>
                    <p class="text-2xl font-bold">${totalExpenses.toLocaleString()} ج.م</p>
                </div>
            `;
            
        } catch (error) {
            console.error('خطأ في تحديث الإحصائيات:', error);
        }
    }

    // ========== نماذج الإدخال الأساسية (مبسطة) ==========
    function showFarmerForm() {
        const content = document.getElementById('content');
        content.innerHTML = `
        <div class="max-w-2xl mx-auto">
            <h3 class="text-2xl font-bold mb-6 flex items-center gap-2">
                <i class="fas fa-user-plus text-green-400"></i>
                <span>إضافة فلاح جديد</span>
            </h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-300 mb-2">الاسم الكامل</label>
                    <input id="farmerName" type="text" placeholder="أدخل اسم الفلاح" 
                           class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600"/>
                </div>
                
                <div>
                    <label class="block text-gray-300 mb-2">رقم الهاتف</label>
                    <input id="farmerPhone" type="tel" placeholder="أدخل رقم الهاتف" 
                           class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600"/>
                </div>
                
                <div class="flex gap-3 pt-4">
                    <button id="saveFarmer" class="flex-1 bg-gradient-to-l from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 py-3 rounded-xl font-bold transition">
                        <i class="fas fa-save ml-2"></i>
                        حفظ البيانات
                    </button>
                    <button id="cancelForm" class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold transition">
                        <i class="fas fa-times ml-2"></i>
                        إلغاء
                    </button>
                </div>
            </div>
            
            <p id="msgFarmer" class="mt-4 text-center font-bold"></p>
        </div>
        `;
        
        document.getElementById('saveFarmer').addEventListener('click', saveFarmer);
        document.getElementById('cancelForm').addEventListener('click', showFarmersList);
    }

    async function saveFarmer() {
        const name = document.getElementById('farmerName').value.trim();
        const phone = document.getElementById('farmerPhone').value.trim();
        
        if(!name || !phone) {
            document.getElementById('msgFarmer').innerText = "❌ الاسم ورقم الهاتف مطلوبان";
            return;
        }
        
        try {
            await addDoc(collection(db, "farmers"), {
                name,
                phone,
                currentBalance: 0,
                totalLoans: 0,
                totalSales: 0,
                status: 'active',
                createdAt: serverTimestamp()
            });
            
            showToast('تم إضافة الفلاح بنجاح', 'success');
            refreshData();
            showFarmersList();
            
        } catch (error) {
            console.error('خطأ في حفظ الفلاح:', error);
            showToast('حدث خطأ في حفظ البيانات', 'error');
        }
    }

    // ========== عرض قائمة الفلاحين ==========
    async function showFarmersList() {
        const content = document.getElementById('content');
        content.innerHTML = '<div class="text-center py-12"><div class="animate-spin rounded-full h-12 w-12 border-t-2 border-amber-500 mx-auto"></div><p class="mt-4">جاري التحميل...</p></div>';
        
        try {
            const farmersSnap = await getDocs(query(collection(db, "farmers"), orderBy("createdAt", "desc")));
            
            if (farmersSnap.empty) {
                content.innerHTML = `
                <div class="text-center py-12">
                    <i class="fas fa-users text-6xl text-gray-600 mb-4"></i>
                    <p class="text-xl text-gray-400 mb-4">لا يوجد فلاحين بعد</p>
                    <button onclick="showFarmerForm()" class="bg-amber-500 hover:bg-amber-600 px-6 py-3 rounded-xl font-bold inline-flex items-center gap-2">
                        <i class="fas fa-plus"></i>
                        إضافة أول فلاح
                    </button>
                </div>
                `;
                return;
            }
            
            let html = `
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">قائمة الفلاحين</h3>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>الاسم</th>
                            <th>رقم الهاتف</th>
                            <th>الرصيد الحالي</th>
                            <th>الحالة</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            let index = 1;
            farmersSnap.forEach(doc => {
                const farmer = doc.data();
                html += `
                    <tr>
                        <td>${index++}</td>
                        <td class="font-bold">${farmer.name}</td>
                        <td dir="ltr">${farmer.phone}</td>
                        <td class="${farmer.currentBalance > 0 ? 'text-danger' : 'text-success'}">${farmer.currentBalance.toLocaleString()} ج.م</td>
                        <td>
                            <span class="badge ${farmer.status === 'active' ? 'badge-success' : 'badge-danger'}">
                                ${farmer.status === 'active' ? 'نشط' : 'غير نشط'}
                            </span>
                        </td>
                        <td>
                            <button onclick="deleteFarmer('${doc.id}')" class="text-danger hover:text-red-300 mx-1" title="حذف">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
            </div>
            `;
            
            content.innerHTML = html;
            
        } catch (error) {
            console.error('خطأ في تحميل الفلاحين:', error);
            content.innerHTML = '<p class="text-danger text-center">حدث خطأ في تحميل البيانات</p>';
        }
    }

    // دوال بسيطة للنماذج الأخرى
    function showLoanForm() {
        const content = document.getElementById('content');
        content.innerHTML = '<p class="text-center py-12">نموذج إضافة سلفة - قيد التطوير</p>';
    }

    function showSaleForm() {
        const content = document.getElementById('content');
        content.innerHTML = '<p class="text-center py-12">نموذج تسجيل بيع - قيد التطوير</p>';
    }

    function showExpenseForm() {
        const content = document.getElementById('content');
        content.innerHTML = '<p class="text-center py-12">نموذج إضافة مصروف - قيد التطوير</p>';
    }

    function showLoansList() {
        const content = document.getElementById('content');
        content.innerHTML = '<p class="text-center py-12">قائمة السلف - قيد التطوير</p>';
    }

    function showSalesList() {
        const content = document.getElementById('content');
        content.innerHTML = '<p class="text-center py-12">قائمة المبيعات - قيد التطوير</p>';
    }

    function showExpensesList() {
        const content = document.getElementById('content');
        content.innerHTML = '<p class="text-center py-12">قائمة المصروفات - قيد التطوير</p>';
    }

    function refreshData() {
        updateStats();
    }

    // دوال الحذف
    window.deleteFarmer = async (id) => {
        if (confirm('هل أنت متأكد من حذف هذا الفلاح؟')) {
            try {
                await deleteDoc(doc(db, "farmers", id));
                showToast('تم الحذف بنجاح', 'success');
                showFarmersList();
            } catch (error) {
                showToast('خطأ في الحذف', 'error');
            }
        }
    };

    // بدء التطبيق
    showLogin();

    // تصدير الدوال المهمة
    window.showFarmerForm = showFarmerForm;
    window.showLoanForm = showLoanForm;
    window.showSaleForm = showSaleForm;
    window.showExpenseForm = showExpenseForm;

</script>
</body>
