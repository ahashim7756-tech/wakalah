<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>وكالة - نظام إدارة متكامل</title>
    
    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ملف التنسيق الرئيسي -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container" id="app">
        <!-- شاشة التحميل الأولية -->
        <div id="loading-screen" class="glass-card" style="text-align: center; padding: 50px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 3rem; color: white; margin-bottom: 20px;"></i>
            <h2 style="color: white;">جاري تحميل النظام...</h2>
        </div>

        <!-- المحتوى الرئيسي (سيتم تعبئته بواسطة JavaScript) -->
        <div id="content"></div>

        <!-- شريط الاختصارات -->
        <div class="shortcuts-bar" style="position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 10px; font-size: 0.8rem; display: none;" id="shortcuts-bar">
            <span><span class="shortcut-badge">F1</span> مبيعات</span>
            <span><span class="shortcut-badge">F2</span> مشتريات</span>
            <span><span class="shortcut-badge">F3</span> عمالة</span>
            <span><span class="shortcut-badge">F4</span> رئيسية</span>
        </div>

        <!-- شريط التنقل السفلي للموبايل -->
        <div class="mobile-nav">
            <a href="#" onclick="window.showDashboard(); return false;" class="mobile-nav-item">
                <i class="fas fa-home"></i>
                <span>الرئيسية</span>
            </a>
            <a href="#" onclick="window.showSaleForm(); return false;" class="mobile-nav-item">
                <i class="fas fa-cash-register"></i>
                <span>مبيعات</span>
            </a>
            <a href="#" onclick="window.showPurchaseForm(); return false;" class="mobile-nav-item">
                <i class="fas fa-shopping-cart"></i>
                <span>مشتريات</span>
            </a>
            <a href="#" onclick="window.showWorkersList(); return false;" class="mobile-nav-item">
                <i class="fas fa-users"></i>
                <span>عمالة</span>
            </a>
            <a href="#" onclick="window.showExpensesList(); return false;" class="mobile-nav-item">
                <i class="fas fa-file-invoice"></i>
                <span>مصروفات</span>
            </a>
        </div>
    </div>

    <!-- نافذة منبثقة للرسائل (Toast) -->
    <div id="toast-container" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: none;"></div>

    <!-- تحميل مكتبات JavaScript -->
    <script src="calculations.js"></script>
    <script>
        // =============================================
        // البيانات الأساسية والتهيئة الأولية
        // =============================================
        
        // قاعدة البيانات المحلية (LocalStorage)
        const Storage = {
            // حفظ البيانات
            set: (key, data) => {
                try {
                    localStorage.setItem(key, JSON.stringify(data));
                    return true;
                } catch (e) {
                    console.error('خطأ في الحفظ:', e);
                    return false;
                }
            },
            
            // قراءة البيانات
            get: (key, defaultValue = null) => {
                try {
                    const data = localStorage.getItem(key);
                    return data ? JSON.parse(data) : defaultValue;
                } catch (e) {
                    console.error('خطأ في القراءة:', e);
                    return defaultValue;
                }
            },
            
            // حذف البيانات
            remove: (key) => {
                try {
                    localStorage.removeItem(key);
                    return true;
                } catch (e) {
                    console.error('خطأ في الحذف:', e);
                    return false;
                }
            }
        };

        // إعدادات النظام
        let SystemSettings = Storage.get('wakala_settings', {
            commissionRate: 10,
            currency: 'ج.م',
            storeName: 'وكالة',
            allowNegativeProfit: false,
            minimumProfit: 0.01
        });

        // بيانات العمال
        let Workers = Storage.get('wakala_workers', []);

        // بيانات المنتجات
        let Products = Storage.get('wakala_products', []);

        // بيانات المبيعات
        let Sales = Storage.get('wakala_sales', []);

        // بيانات المشتريات
        let Purchases = Storage.get('wakala_purchases', []);

        // بيانات المصروفات
        let Expenses = Storage.get('wakala_expenses', []);

        // بيانات الفلاحين
        let Farmers = Storage.get('wakala_farmers', []);

        // =============================================
        // تحميل البيانات الافتراضية من ملف JSON
        // =============================================
        async function loadDefaultData() {
            try {
                // محاولة تحميل البيانات الافتراضية من ملف JSON
                const response = await fetch('data-defaults.json');
                if (response.ok) {
                    const defaults = await response.json();
                    
                    // تحميل الإعدادات إذا لم تكن موجودة
                    if (!Storage.get('wakala_settings')) {
                        Storage.set('wakala_settings', defaults.settings);
                        SystemSettings = defaults.settings;
                    }
                    
                    // تحميل العمال إذا لم يكونوا موجودين
                    if (!Storage.get('wakala_workers') || Storage.get('wakala_workers').length === 0) {
                        Storage.set('wakala_workers', defaults.workers);
                        Workers = defaults.workers;
                    }
                    
                    // تحميل المنتجات إذا لم تكن موجودة
                    if (!Storage.get('wakala_products') || Storage.get('wakala_products').length === 0) {
                        Storage.set('wakala_products', defaults.products);
                        Products = defaults.products;
                    }
                    
                    console.log('تم تحميل البيانات الافتراضية بنجاح');
                }
            } catch (error) {
                console.log('لا يوجد ملف بيانات افتراضية أو خطأ في تحميله:', error);
            }
        }

        // =============================================
        // دوال مساعدة
        // =============================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            
            const colors = {
                success: '#28a745',
                error: '#dc3545',
                info: '#17a2b8',
                warning: '#ffc107'
            };
            
            container.style.backgroundColor = colors[type] || colors.info;
            container.style.color = type === 'warning' ? '#212529' : 'white';
            container.style.padding = '15px 25px';
            container.style.borderRadius = '50px';
            container.style.fontWeight = 'bold';
            container.style.boxShadow = '0 5px 15px rgba(0,0,0,0.3)';
            container.style.display = 'block';
            container.textContent = message;
            
            setTimeout(() => {
                container.style.display = 'none';
            }, 3000);
        }

        function formatNumber(value) {
            const num = parseFloat(value) || 0;
            return num.toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,');
        }

        // تحديث جميع البيانات من التخزين
        function refreshData() {
            Workers = Storage.get('wakala_workers', []);
            Products = Storage.get('wakala_products', []);
            Sales = Storage.get('wakala_sales', []);
            Purchases = Storage.get('wakala_purchases', []);
            Expenses = Storage.get('wakala_expenses', []);
            Farmers = Storage.get('wakala_farmers', []);
            SystemSettings = Storage.get('wakala_settings', SystemSettings);
        }

        // =============================================
        // إدارة الاختصارات (Keyboard Shortcuts)
        // =============================================
        document.addEventListener('keydown', (e) => {
            // منع السلوك الافتراضي للمتصفح للاختصارات
            if (e.key.startsWith('F') || (e.ctrlKey && e.key === 's')) {
                e.preventDefault();
            }
            
            switch(e.key) {
                case 'F1':
                    showSaleForm();
                    break;
                case 'F2':
                    showPurchaseForm();
                    break;
                case 'F3':
                    showWorkersList();
                    break;
                case 'F4':
                    showDashboard();
                    break;
                case 'F5':
                    refreshData();
                    showToast('تم تحديث البيانات', 'success');
                    break;
            }
            
            // Ctrl+S للحفظ
            if (e.ctrlKey && e.key === 's') {
                // سيتم التعامل معها من النماذج المختلفة
                const saveButton = document.querySelector('button[id^="save"]');
                if (saveButton) {
                    saveButton.click();
                }
            }
        });

        // =============================================
        // بدء التطبيق
        // =============================================
        document.addEventListener('DOMContentLoaded', async () => {
            // إخفاء شاشة التحميل
            const loadingScreen = document.getElementById('loading-screen');
            
            // تحميل البيانات الافتراضية
            await loadDefaultData();
            
            // تحديث البيانات من التخزين
            refreshData();
            
            // إخفاء شاشة التحميل بعد ثانية
            setTimeout(() => {
                if (loadingScreen) loadingScreen.style.display = 'none';
                // عرض شاشة تسجيل الدخول
                showLogin();
                // عرض شريط الاختصارات بعد قليل
                document.getElementById('shortcuts-bar').style.display = 'block';
            }, 1000);
        });

        // =============================================
        // سيتم إضافة باقي الدوال (showLogin, showDashboard, etc.)
        // في ملف app.js
        // =============================================
    </script>
    <!-- تحميل ملف التطبيق الرئيسي -->
    <script src="app.js"></script>
</body>
</html>
