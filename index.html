<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وكالة - Wakala SaaS | إدارة الوكالات الزراعية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f97316;
            --info: #3b82f6;
            --card-bg: #1e293b;
            --card-hover: #2d3a4f;
            --border: #334155;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            min-height: 100vh;
        }

        .bg-card {
            background-color: var(--card-bg);
            transition: all 0.3s ease;
            border: 1px solid var(--border);
        }

        .bg-card:hover {
            background-color: var(--card-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .text-accent { color: var(--primary); }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-warning { color: var(--warning); }
        .text-info { color: var(--info); }

        button {
            transition: all 0.2s ease;
            font-weight: 700;
        }

        input, select, textarea {
            border-radius: 0.75rem !important;
            background-color: #2d3a4f !important;
            border: 2px solid var(--border) !important;
            color: white !important;
            padding: 0.75rem 1rem !important;
        }

        input:focus, select:focus, textarea:focus {
            outline: none !important;
            border-color: var(--primary) !important;
            background-color: #334155 !important;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #2d3a4f;
            color: var(--primary);
            font-weight: 700;
            padding: 1rem;
            text-align: center;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 0.75rem 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
            color: #e2e8f0;
        }

        tr:hover {
            background-color: #2d3a4f;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--card-bg) 0%, #2d3a4f 100%);
            border-radius: 1rem;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--info));
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        #toast {
            animation: slideDown 0.3s ease;
        }

        .toast-success {
            background-color: #10b981;
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-weight: bold;
            border-right: 6px solid #059669;
        }

        .toast-error {
            background-color: #ef4444;
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-weight: bold;
            border-right: 6px solid #b91c1c;
        }

        .toast-info {
            background-color: #3b82f6;
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-weight: bold;
            border-right: 6px solid #1d4ed8;
        }

        @keyframes slideDown {
            from {
                transform: translate(-50%, -100%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            display: inline-block;
        }

        .badge-success {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .badge-danger {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .badge-warning {
            background-color: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-gray-900 font-[Tajawal] text-white">

<!-- شاشة التحميل -->
<div id="loadingScreen" class="fixed inset-0 bg-gray-900 z-50 flex items-center justify-center hidden">
    <div class="text-center">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-amber-500 border-solid mx-auto mb-4"></div>
        <p class="text-amber-400 text-xl font-bold">جاري التحميل...</p>
    </div>
</div>

<!-- رسائل التنبيه -->
<div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 hidden"></div>

<main id="app" class="min-h-screen flex items-center justify-center p-6"></main>

<script type="module">
    // ==================== Firebase Config (للتخزين المحلي مؤقتاً) ====================
    // نستخدم localStorage بدلاً من Firebase للتجربة السريعة
    class LocalDB {
        constructor() {
            this.initDB();
        }

        initDB() {
            if (!localStorage.getItem('farmers')) localStorage.setItem('farmers', '[]');
            if (!localStorage.getItem('loans')) localStorage.setItem('loans', '[]');
            if (!localStorage.getItem('sales')) localStorage.setItem('sales', '[]');
            if (!localStorage.getItem('expenses')) localStorage.setItem('expenses', '[]');
        }

        // المزارعين
        getFarmers() {
            return JSON.parse(localStorage.getItem('farmers'));
        }

        addFarmer(farmer) {
            const farmers = this.getFarmers();
            farmer.id = Date.now() + Math.random().toString(36);
            farmer.createdAt = new Date().toISOString();
            farmers.push(farmer);
            localStorage.setItem('farmers', JSON.stringify(farmers));
            return farmer;
        }

        deleteFarmer(id) {
            const farmers = this.getFarmers().filter(f => f.id !== id);
            localStorage.setItem('farmers', JSON.stringify(farmers));
        }

        updateFarmer(id, updates) {
            const farmers = this.getFarmers();
            const index = farmers.findIndex(f => f.id === id);
            if (index !== -1) {
                farmers[index] = { ...farmers[index], ...updates };
                localStorage.setItem('farmers', JSON.stringify(farmers));
            }
        }

        // السلف
        getLoans() {
            return JSON.parse(localStorage.getItem('loans'));
        }

        addLoan(loan) {
            const loans = this.getLoans();
            loan.id = Date.now() + Math.random().toString(36);
            loan.createdAt = new Date().toISOString();
            loans.push(loan);
            localStorage.setItem('loans', JSON.stringify(loans));
            
            // تحديث رصيد الفلاح
            const farmers = this.getFarmers();
            const farmerIndex = farmers.findIndex(f => f.id === loan.farmerId);
            if (farmerIndex !== -1) {
                farmers[farmerIndex].currentBalance = (farmers[farmerIndex].currentBalance || 0) + loan.amount;
                farmers[farmerIndex].totalLoans = (farmers[farmerIndex].totalLoans || 0) + 1;
                localStorage.setItem('farmers', JSON.stringify(farmers));
            }
            return loan;
        }

        deleteLoan(id) {
            const loans = this.getLoans();
            const loan = loans.find(l => l.id === id);
            if (loan) {
                // استرداد الرصيد
                const farmers = this.getFarmers();
                const farmerIndex = farmers.findIndex(f => f.id === loan.farmerId);
                if (farmerIndex !== -1) {
                    farmers[farmerIndex].currentBalance = (farmers[farmerIndex].currentBalance || 0) - loan.amount;
                    farmers[farmerIndex].totalLoans = (farmers[farmerIndex].totalLoans || 0) - 1;
                    localStorage.setItem('farmers', JSON.stringify(farmers));
                }
            }
            const newLoans = loans.filter(l => l.id !== id);
            localStorage.setItem('loans', JSON.stringify(newLoans));
        }

        updateLoanPayment(id, amount) {
            const loans = this.getLoans();
            const index = loans.findIndex(l => l.id === id);
            if (index !== -1) {
                loans[index].paidAmount = (loans[index].paidAmount || 0) + amount;
                if (loans[index].paidAmount >= loans[index].totalAmount) {
                    loans[index].status = 'paid';
                }
                localStorage.setItem('loans', JSON.stringify(loans));
            }
        }

        // المبيعات
        getSales() {
            return JSON.parse(localStorage.getItem('sales'));
        }

        addSale(sale) {
            const sales = this.getSales();
            sale.id = Date.now() + Math.random().toString(36);
            sale.createdAt = new Date().toISOString();
            sales.push(sale);
            localStorage.setItem('sales', JSON.stringify(sales));

            // تحديث إحصائيات الفلاح
            const farmers = this.getFarmers();
            const farmerIndex = farmers.findIndex(f => f.id === sale.farmerId);
            if (farmerIndex !== -1) {
                farmers[farmerIndex].totalSales = (farmers[farmerIndex].totalSales || 0) + 1;
                farmers[farmerIndex].totalProfit = (farmers[farmerIndex].totalProfit || 0) + (sale.profit || 0);
                localStorage.setItem('farmers', JSON.stringify(farmers));
            }
            return sale;
        }

        deleteSale(id) {
            const sales = this.getSales().filter(s => s.id !== id);
            localStorage.setItem('sales', JSON.stringify(sales));
        }

        // المصروفات
        getExpenses() {
            return JSON.parse(localStorage.getItem('expenses'));
        }

        addExpense(expense) {
            const expenses = this.getExpenses();
            expense.id = Date.now() + Math.random().toString(36);
            expense.createdAt = new Date().toISOString();
            expenses.push(expense);
            localStorage.setItem('expenses', JSON.stringify(expenses));
            return expense;
        }

        deleteExpense(id) {
            const expenses = this.getExpenses().filter(e => e.id !== id);
            localStorage.setItem('expenses', JSON.stringify(expenses));
        }
    }

    const db = new LocalDB();

    // ==================== المتغيرات العامة ====================
    const app = document.getElementById('app');

    // ==================== دالة عرض التنبيهات ====================
    function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        toast.className = `fixed top-4 left-1/2 transform -translate-x-1/2 z-50 toast-${type} shadow-2xl`;
        toast.innerHTML = `
            <div class="flex items-center gap-3">
                <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'} text-xl"></i>
                <span class="font-bold">${message}</span>
            </div>
        `;
        toast.classList.remove('hidden');
        
        setTimeout(() => {
            toast.classList.add('hidden');
        }, 3000);
    }

    // ==================== شاشة تسجيل الدخول ====================
    function showLogin() {
        app.innerHTML = `
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <div class="inline-block p-4 bg-amber-500/20 rounded-full mb-4">
                    <i class="fas fa-seedling text-5xl text-amber-400"></i>
                </div>
                <h1 class="text-4xl font-extrabold text-amber-400 mb-2">وكالة</h1>
                <p class="text-gray-400 text-lg">نظام إدارة الوكالات الزراعية</p>
            </div>
            
            <div class="bg-gray-800/50 backdrop-blur-sm p-8 rounded-2xl shadow-2xl border border-gray-700">
                <h2 class="text-2xl mb-6 text-amber-400 font-bold flex items-center gap-2">
                    <i class="fas fa-lock"></i>
                    <span>تسجيل دخول الإدارة</span>
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-300 mb-2">كلمة المرور</label>
                        <input id="password" type="password" placeholder="أدخل كلمة المرور" 
                               class="w-full p-4 rounded-xl bg-gray-700 border border-gray-600 text-white focus:border-amber-500 transition"/>
                    </div>
                    
                    <button id="loginBtn" 
                            class="w-full bg-gradient-to-l from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 py-4 rounded-xl font-bold text-lg shadow-lg shadow-amber-500/30 transition transform hover:scale-[1.02]">
                        <i class="fas fa-sign-in-alt ml-2"></i>
                        دخول
                    </button>
                    
                    <p id="msg" class="mt-4 text-red-500 font-bold text-center"></p>
                </div>
            </div>
            
            <p class="text-center text-gray-500 mt-8 text-sm">
                © 2024 وكالة - جميع الحقوق محفوظة
            </p>
        </div>
        `;
        
        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    }

    function login() {
        const pwd = document.getElementById('password').value;
        if(pwd === "wakala123") {
            showToast('تم تسجيل الدخول بنجاح', 'success');
            showDashboard();
        } else {
            document.getElementById('msg').innerText = "❌ كلمة المرور غير صحيحة";
            showToast('كلمة المرور غير صحيحة', 'error');
        }
    }

    // ==================== لوحة التحكم الرئيسية ====================
    function showDashboard() {
        app.innerHTML = `
        <div class="w-full max-w-7xl">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8">
                <div class="flex items-center gap-3 mb-4 md:mb-0">
                    <div class="p-3 bg-amber-500/20 rounded-2xl">
                        <i class="fas fa-chart-pie text-3xl text-amber-400"></i>
                    </div>
                    <div>
                        <h2 class="text-3xl font-extrabold text-amber-400">لوحة التحكم</h2>
                        <p class="text-gray-400">نظام إدارة الوكالة المتكامل</p>
                    </div>
                </div>
                
                <div class="flex gap-3">
                    <button id="refreshBtn" class="bg-gray-800 hover:bg-gray-700 p-3 rounded-xl transition">
                        <i class="fas fa-sync-alt text-amber-400"></i>
                    </button>
                    <button id="logoutBtn" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 px-6 py-3 rounded-xl font-bold transition flex items-center gap-2">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>تسجيل خروج</span>
                    </button>
                </div>
            </div>
            
            <div id="stats" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></div>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <button id="addFarmer" class="stat-card flex flex-col items-center justify-center p-4 hover:scale-105">
                    <div class="stat-icon bg-green-500/20 text-green-400">
                        <i class="fas fa-user-plus text-2xl"></i>
                    </div>
                    <span class="font-bold mt-2">إضافة فلاح</span>
                </button>
                
                <button id="addLoan" class="stat-card flex flex-col items-center justify-center p-4 hover:scale-105">
                    <div class="stat-icon bg-blue-500/20 text-blue-400">
                        <i class="fas fa-hand-holding-usd text-2xl"></i>
                    </div>
                    <span class="font-bold mt-2">إضافة سلفة</span>
                </button>
                
                <button id="addSale" class="stat-card flex flex-col items-center justify-center p-4 hover:scale-105">
                    <div class="stat-icon bg-purple-500/20 text-purple-400">
                        <i class="fas fa-shopping-cart text-2xl"></i>
                    </div>
                    <span class="font-bold mt-2">تسجيل بيع</span>
                </button>
                
                <button id="addExpense" class="stat-card flex flex-col items-center justify-center p-4 hover:scale-105">
                    <div class="stat-icon bg-orange-500/20 text-orange-400">
                        <i class="fas fa-wallet text-2xl"></i>
                    </div>
                    <span class="font-bold mt-2">مصروفات</span>
                </button>
            </div>
            
            <div class="flex border-b border-gray-700 mb-6">
                <button id="tabFarmers" class="tab-btn px-6 py-3 font-bold text-gray-400 hover:text-amber-400 border-b-2 border-transparent transition">
                    <i class="fas fa-users ml-2"></i>
                    الفلاحين
                </button>
                <button id="tabLoans" class="tab-btn px-6 py-3 font-bold text-gray-400 hover:text-amber-400 border-b-2 border-transparent transition">
                    <i class="fas fa-hand-holding-usd ml-2"></i>
                    السلف
                </button>
                <button id="tabSales" class="tab-btn px-6 py-3 font-bold text-gray-400 hover:text-amber-400 border-b-2 border-transparent transition">
                    <i class="fas fa-chart-line ml-2"></i>
                    المبيعات
                </button>
                <button id="tabExpenses" class="tab-btn px-6 py-3 font-bold text-gray-400 hover:text-amber-400 border-b-2 border-transparent transition">
                    <i class="fas fa-file-invoice ml-2"></i>
                    المصروفات
                </button>
            </div>
            
            <div id="content" class="bg-card rounded-2xl p-6 border border-gray-700"></div>
        </div>
        `;
        
        document.getElementById('addFarmer').addEventListener('click', () => showFarmerForm());
        document.getElementById('addLoan').addEventListener('click', () => showLoanForm());
        document.getElementById('addSale').addEventListener('click', () => showSaleForm());
        document.getElementById('addExpense').addEventListener('click', () => showExpenseForm());
        document.getElementById('refreshBtn').addEventListener('click', refreshData);
        document.getElementById('logoutBtn').addEventListener('click', showLogin);
        
        document.getElementById('tabFarmers').addEventListener('click', () => showFarmersList());
        document.getElementById('tabLoans').addEventListener('click', () => showLoansList());
        document.getElementById('tabSales').addEventListener('click', () => showSalesList());
        document.getElementById('tabExpenses').addEventListener('click', () => showExpensesList());
        
        refreshData();
        showFarmersList();
    }

    // ==================== تحديث الإحصائيات ====================
    function updateStats() {
        const statsDiv = document.getElementById('stats');
        
        const farmers = db.getFarmers();
        const loans = db.getLoans();
        const sales = db.getSales();
        const expenses = db.getExpenses();
        
        const totalFarmers = farmers.length;
        const totalLoans = loans.reduce((sum, loan) => sum + (loan.amount || 0), 0);
        const totalSales = sales.reduce((sum, sale) => sum + (sale.total || 0), 0);
        const totalExpenses = expenses.reduce((sum, exp) => sum + (exp.amount || 0), 0);
        
        statsDiv.innerHTML = `
            <div class="stat-card">
                <div class="stat-icon bg-green-500/20 text-green-400">
                    <i class="fas fa-users"></i>
                </div>
                <p class="text-sm opacity-60">عدد الفلاحين</p>
                <p class="text-2xl font-bold">${totalFarmers}</p>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon bg-blue-500/20 text-blue-400">
                    <i class="fas fa-hand-holding-usd"></i>
                </div>
                <p class="text-sm opacity-60">إجمالي السلف</p>
                <p class="text-2xl font-bold">${totalLoans.toLocaleString()} ج.م</p>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon bg-purple-500/20 text-purple-400">
                    <i class="fas fa-shopping-cart"></i>
                </div>
                <p class="text-sm opacity-60">إجمالي المبيعات</p>
                <p class="text-2xl font-bold">${totalSales.toLocaleString()} ج.م</p>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon bg-orange-500/20 text-orange-400">
                    <i class="fas fa-wallet"></i>
                </div>
                <p class="text-sm opacity-60">إجمالي المصروفات</p>
                <p class="text-2xl font-bold">${totalExpenses.toLocaleString()} ج.م</p>
            </div>
        `;
    }

    // ==================== قائمة الفلاحين ====================
    function showFarmersList() {
        const content = document.getElementById('content');
        const farmers = db.getFarmers();
        
        if (farmers.length === 0) {
            content.innerHTML = `
            <div class="text-center py-12">
                <i class="fas fa-users text-6xl text-gray-600 mb-4"></i>
                <p class="text-xl text-gray-400 mb-4">لا يوجد فلاحين بعد</p>
                <button onclick="showFarmerForm()" class="bg-amber-500 hover:bg-amber-600 px-6 py-3 rounded-xl font-bold">
                    <i class="fas fa-plus ml-2"></i>
                    إضافة أول فلاح
                </button>
            </div>
            `;
            return;
        }
        
        let html = `
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-bold">قائمة الفلاحين</h3>
            <input type="text" id="searchFarmers" placeholder="بحث..." class="px-4 py-2 rounded-lg bg-gray-700">
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>الاسم</th>
                        <th>رقم الهاتف</th>
                        <th>الرصيد الحالي</th>
                        <th>عدد السلف</th>
                        <th>إجمالي المبيعات</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody>
        `;
        
        farmers.forEach((farmer, index) => {
            html += `
                <tr class="farmer-row">
                    <td>${index + 1}</td>
                    <td class="font-bold">${farmer.name}</td>
                    <td>${farmer.phone}</td>
                    <td class="${(farmer.currentBalance || 0) > 0 ? 'text-danger' : 'text-success'}">${(farmer.currentBalance || 0).toLocaleString()} ج.م</td>
                    <td>${farmer.totalLoans || 0}</td>
                    <td>${farmer.totalSales || 0}</td>
                    <td>
                        <button onclick="deleteFarmer('${farmer.id}')" class="text-danger hover:text-red-300 mx-1" title="حذف">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;

    function saveLoan() {
        const farmerId = document.getElementById('loanFarmer').value;
        const amount = parseFloat(document.getElementById('loanAmount').value);
        const purpose = document.getElementById('loanPurpose').value;
        const dueDate = document.getElementById('loanDueDate').value;
        const interest = parseFloat(document.getElementById('loanInterest').value) || 0;
        const notes = document.getElementById('loanNotes').value;

            showToast('يرجى اختيار الفلاح وإدخال مبلغ صحيح', 'error');
            return;
        }
        
        db.addLoan({
            farmerId,
            amount,
            purpose: purpose || 'بدون',
            dueDate,
            interest,
            totalAmount: amount + (amount * interest / 100),
            paidAmount: 0,
            status: 'pending',

        });
        
        showToast('تم إضافة السلفة بنجاح', 'success');
        refreshData();
        showLoansList();

        const farmerId = document.getElementById('saleFarmer').value;
        const product = document.getElementById('saleProduct').value;
        const quantity = parseFloat(document.getElementById('saleQuantity').value);
        const unitPrice = parseFloat(document.getElementById('saleUnitPrice').value);
        const cost = parseFloat(document.getElementById('saleCost').value);
        const paymentMethod = document.getElementById('salePayment').value;
        
        if(!farmerId || !product || quantity <= 0 || unitPrice <= 0) {
            showToast('يرجى إدخال جميع البيانات المطلوبة', 'error');
            return;
        }
        
        const total = quantity * unitPrice;
        const profit = total - (cost * quantity);
        
        db.addSale({
            farmerId,
            product,
            quantity,
            unitPrice,
            total,
            cost: cost * quantity,
            profit,
            paymentMethod
        });
        
        showToast('تم تسجيل البيع بنجاح', 'success');
        refreshData();
        showSalesList();
    }

                    <tr>
                        <td colspan="3">الإجمالي:</td>
                        <td class="text-danger">${totalExpenses.toLocaleString()} ج.م</td>
                        <td colspan="2"></td>
                    </tr>
                </tfoot>
            </table>
        </div>
        `;
        
        content.innerHTML = html;
        
        document.getElementById('expenseFilter').addEventListener('change', function(e) {
            const filter = e.target.value;
            document.querySelectorAll('.expense-row').forEach(row => {
                row.style.display = (filter === 'all' || row.dataset.type === filter) ? '' : 'none';
            });
        });
    }

    // ==================== نموذج إضافة مصروف ====================
    function showExpenseForm() {
        const content = document.getElementById('content');
        content.innerHTML = `
        <div class="max-w-2xl mx-auto">
            <h3 class="text-2xl font-bold mb-6 flex items-center gap-2">
                <i class="fas fa-wallet text-orange-400"></i>
                <span>تسجيل مصروف</span>
            </h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-300 mb-2">نوع المصروف</label>
                    <select id="expenseType" class="w-full p-3 rounded-lg bg-gray-700">
                        <option value="rent">إيجار</option>
                        <option value="salaries">رواتب</option>
                        <option value="utilities">فواتير</option>
                        <option value="transport">نقل</option>
                        <option value="maintenance">صيانة</option>
                        <option value="other">أخرى</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-gray-300 mb-2">الوصف</label>
                    <input id="expenseDesc" type="text" placeholder="وصف المصروف" 
                           class="w-full p-3 rounded-lg bg-gray-700"/>
                </div>
                
                <div>
                    <label class="block text-gray-300 mb-2">المبلغ (ج.م)</label>
                    <input id="expenseAmount" type="number" placeholder="أدخل المبلغ" 
                           class="w-full p-3 rounded-lg bg-gray-700"/>
                </div>
                
                <div>
                    <label class="block text-gray-300 mb-2">التاريخ</label>
                    <input id="expenseDate" type="date" value="${new Date().toISOString().split('T')[0]}" 
                           class="w-full p-3 rounded-lg bg-gray-700"/>
                </div>
                
                <div class="flex gap-3 pt-4">
                    <button id="saveExpense" class="flex-1 bg-gradient-to-l from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 py-3 rounded-xl font-bold">
                        <i class="fas fa-save ml-2"></i>
                        تسجيل المصروف
                    </button>
                    <button id="cancelForm" class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold">
                        <i class="fas fa-times ml-2"></i>
                        إلغاء
                    </button>
                </div>
            </div>
        </div>
        `;
        
        document.getElementById('saveExpense').addEventListener('click', saveExpense);
        document.getElementById('cancelForm').addEventListener('click', showExpensesList);
    }

    function saveExpense() {
        const type = document.getElementById('expenseType').value;
        const description = document.getElementById('expenseDesc').value;
        const amount = parseFloat(document.getElementById('expenseAmount').value);
        const date = document.getElementById('expenseDate').value;
        
        if(!description || !amount || amount <= 0) {
            showToast('يرجى إدخال وصف المصروف ومبلغ صحيح', 'error');
            return;
        }
        
        db.addExpense({
            type,
            description,
            amount,
            date
        });
        
        showToast('تم تسجيل المصروف بنجاح', 'success');
        refreshData();
        showExpensesList();
    }

    // ==================== دوال مساعدة ====================
    function refreshData() {
        updateStats();
    }

    // دوال الحذف
    window.deleteFarmer = (id) => {
        if (confirm('هل أنت متأكد من حذف هذا الفلاح؟')) {
            db.deleteFarmer(id);
            showToast('تم الحذف بنجاح', 'success');
            refreshData();
            showFarmersList();
        }
    };

    window.deleteLoan = (id) => {
        if (confirm('هل أنت متأكد من حذف هذه السلفة؟')) {
            db.deleteLoan(id);
            showToast('تم الحذف بنجاح', 'success');
            refreshData();
            showLoansList();
        }
    };

    window.deleteSale = (id) => {
        if (confirm('هل أنت متأكد من حذف هذا البيع؟')) {
            db.deleteSale(id);
            showToast('تم الحذف بنجاح', 'success');
            refreshData();
            showSalesList();
        }
    };

    window.deleteExpense = (id) => {
        if (confirm('هل أنت متأكد من حذف هذا المصروف؟')) {
            db.deleteExpense(id);
            showToast('تم الحذف بنجاح', 'success');
            refreshData();
            showExpensesList();
        }
    };

    // تصدير الدوال المهمة
    window.showFarmerForm = showFarmerForm;
    window.showLoanForm = showLoanForm;
    window.showSaleForm = showSaleForm;
    window.showExpenseForm = showExpenseForm;

    // بدء التطبيق
    showLogin();
</script>
</body>
</html>
